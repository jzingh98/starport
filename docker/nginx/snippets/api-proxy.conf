# Proxy to the backend when API_UPSTREAM is set (docker compose). In
# Kubernetes the Ingress or HTTPRoute sends these paths straight to the backend
# and API_UPSTREAM stays empty.
if ($starport_api_upstream = "") {
    return 404;
}

proxy_pass $starport_api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $starport_forwarded_proto;
proxy_set_header X-Forwarded-Host $starport_forwarded_host;

# Keep streaming API responses unbuffered. The trusted API handles metadata;
# game bundles use scoped direct-to-storage upload capabilities.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
