{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "starport.backendAccountName" . }}
  labels:
    {{- include "starport.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.frontendServiceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "starport.frontendAccountName" . }}
  labels:
    {{- include "starport.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.delivery.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "starport.deliveryAccountName" . }}
  labels:
    {{- include "starport.labels" . | nindent 4 }}
  {{- with .Values.delivery.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.processor.enabled .Values.processor.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "processor.serviceAccount.name is required" .Values.processor.serviceAccount.name }}
  namespace: {{ required "processor.serviceAccount.namespace is required" .Values.processor.serviceAccount.namespace }}
  labels:
    {{- include "starport.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.processingWorker.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "starport.processingWorkerAccountName" . }}
  labels:
    {{- include "starport.labels" . | nindent 4 }}
  {{- with .Values.processingWorker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
