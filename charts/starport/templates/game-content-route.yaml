{{- if .Values.gameContent.enabled }}
{{- if not .Values.gameContent.rootDomain }}{{ fail "gameContent.rootDomain is required" }}{{ end }}
{{- if ne .Values.gameContent.hostLabelPrefix "g-" }}{{ fail "gameContent.hostLabelPrefix must be g-" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "starport.fullname" . }}-game-content
  labels:
    {{- include "starport.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ printf "*.%s" .Values.gameContent.rootDomain | quote }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: {{ include "starport.backendServiceName" . }}, port: {{ .Values.backend.service.port }}}
{{- end }}
