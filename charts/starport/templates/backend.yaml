apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "starport.backendServiceName" . }}
  labels:
    {{- include "starport.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "starport.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "starport.backendAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: {{ .Values.backend.scratchSizeLimit | quote }}}
      containers:
        - name: backend
          image: {{ include "starport.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: scratch, mountPath: /tmp}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - {name: ASPNETCORE_ENVIRONMENT, value: {{ .Values.config.environment | quote }}}
            - {name: Database__Migrate, value: "skip"}
            {{- include "starport.databaseEnv" . | nindent 12 }}
            - {name: Auth__Mode, value: {{ .Values.config.auth.mode | quote }}}
            - {name: Auth__Oidc__Authority, value: {{ .Values.config.auth.oidc.authority | quote }}}
            - {name: Auth__Oidc__Audience, value: {{ .Values.config.auth.oidc.audience | quote }}}
            - {name: Auth__Oidc__ClientId, value: {{ .Values.config.auth.oidc.clientId | quote }}}
            - {name: Workspaces__Source, value: {{ .Values.config.workspaces.source | quote }}}
            - {name: Reconciliation__Enabled, value: {{ .Values.config.reconciliation.enabled | quote }}}
            - {name: Processing__Mode, value: {{ .Values.config.processing.mode | quote }}}
            - {name: Processing__WorkerEnabled, value: "false"}
            {{- include "starport.storageEnv" . | nindent 12 }}
            - {name: ForwardedHeaders__ForwardLimit, value: {{ .Values.config.forwardedHeaders.forwardLimit | quote }}}
            {{- range $index, $network := .Values.config.forwardedHeaders.knownNetworks }}
            - {name: ForwardedHeaders__KnownNetworks__{{ $index }}, value: {{ $network | quote }}}
            {{- end }}
            {{- if eq .Values.config.workspaces.source "accounts" }}
            - {name: Accounts__BaseUrl, value: {{ .Values.config.accounts.baseUrl | quote }}}
            - {name: Accounts__TokenUrl, value: {{ .Values.config.accounts.tokenUrl | quote }}}
            - {name: Accounts__ClientId, value: {{ .Values.config.accounts.clientId | quote }}}
            - {name: Accounts__PublicUrl, value: {{ .Values.config.accounts.publicUrl | quote }}}
            - name: Accounts__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.accountsClientSecretKey }}
            {{- end }}
            {{- if .Values.config.publicUrl }}
            - {name: PublicUrl, value: {{ .Values.config.publicUrl | quote }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "starport.backendServiceName" . }}
  labels:
    {{- include "starport.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - {name: http, port: {{ .Values.backend.service.port }}, targetPort: http, protocol: TCP}
